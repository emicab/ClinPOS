[package]
name = "clinpos"
version = "1.16.2"
description = "ClinPOS By EmiDev"
authors = ["Emiliano Cabanillas"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
keyring = "3.2.1"
rand = "0.8.5"
chrono = "0.4.38"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-updater = "2.2.0"
tauri-plugin-shell = "2.2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
tauri-plugin-single-instance = "2.4.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
