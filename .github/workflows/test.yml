name: Tests

on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**", "test/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (esquema + dominio + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Tests
        run: npm test

      - name: Cobertura
        if: always()
        run: npm run test:cov

      # upload-artifact ignora los archivos ocultos por defecto y
      # test/.coverage empieza con punto: sin include-hidden-files el
      # artefacto se descarta aunque la cobertura se haya generado.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: test/.coverage
          include-hidden-files: true
          retention-days: 7

  rust:
    name: Cargo test (shell Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # build.rs valida los recursos declarados en tauri.conf.json. El glob
      # ../app_standalone/**/* no existe en un checkout limpio (se genera en
      # build:next), así que sin este placeholder cargo test falla antes de
      # compilar los tests.
      - name: Preparar recursos del bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app_standalone -Force | Out-Null
          New-Item -ItemType File -Path app_standalone/.keep -Force | Out-Null

      - name: Tests de lib.rs
        run: cargo test --manifest-path src-tauri/Cargo.toml
